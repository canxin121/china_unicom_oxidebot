[package]
name = "china_unicom_oxidebot"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "China Unicom usage query and notification handler for OxideBot"
license = "GPL-3.0-only"
repository = "https://github.com/canxin121/china_unicom_oxidebot"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
china_unicom = { package = "china-unicom-rs", version = "1.0.0", git = "https://github.com/canxin121/china-unicom-rs", default-features = false }
clap = { version = "4.6.4", features = ["derive"] }
dashmap = "6.2.1"
oxidebot = "0.1.8"
sea-orm = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
serde_json = "1.0.151"
shlex = "2.0.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
telegram_bot_oxidebot = "0.1.4"
