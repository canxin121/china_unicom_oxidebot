[package]
name = "china_unicom_oxidebot"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "China Unicom usage query and notification handler for OxideBot"
license = "GPL-3.0-only"
repository = "https://github.com/canxin121/china_unicom_oxidebot"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
china_unicom = { package = "china-unicom-rs", version = "1.0.0", git = "https://github.com/canxin121/china-unicom-rs", default-features = false }
dashmap = "6.2.1"
oxidebot = { git = "https://github.com/canxin121/oxidebot", rev = "5eb05f6242230fe988cd163d14d3a67241a2bbd2", version = "1.0.0" }
sea-orm = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
oxidebot-adapter-telegram = { git = "https://github.com/canxin121/oxidebot", rev = "5eb05f6242230fe988cd163d14d3a67241a2bbd2", version = "1.0.0" }
